name: Lint Data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/lint-data.yml'
  push:
    branches: main
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise exec -- pip install -r scripts/requirements.txt

      - name: Lint the data files
        # --annotations surfaces each problem inline on the changed lines in the
        # PR's Files view, on top of the plain output in the job log.
        run: mise exec -- ./scripts/lint_data.py --annotations
