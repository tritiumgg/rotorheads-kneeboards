name: Update Map Data

on:
  schedule:
    # Every 4 hours, on the hour. GitHub Actions cron is always UTC.
    # Scheduled runs can be delayed by several minutes under load.
    - cron: '0 */4 * * *'
  push:
    # A data edit landing on main can leave an open pull request unmergeable;
    # re-running here rebases it promptly instead of waiting for the next
    # scheduled run.
    branches: main
    paths:
      - 'data/farps.toml'
      - 'data/airports.toml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without pushing or touching pull requests'
        type: boolean
        default: false

permissions:
  contents: write # Push the automation branch
  pull-requests: write # Open and close the update PR

# Never let two runs fight over the same automation branch.
concurrency:
  group: update-map-data
  cancel-in-progress: false

env:
  # Head branch for the automated pull request.
  FARP_BRANCH: automation/data

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up tools
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise exec -- pip install -r scripts/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch map data
        # The only step that talks to the server. Everything after it works from
        # the downloaded file. The address lives in the MAP_DATA_URL repository
        # variable so it can be changed without a commit.
        env:
          MAP_DATA_URL: ${{ vars.MAP_DATA_URL }}
        run: |
          if [[ -z "${MAP_DATA_URL}" ]]; then
            echo "The MAP_DATA_URL repository variable is not set."
            echo "Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          mise exec -- ./scripts/fetch-map-data.sh --force --verbose "${MAP_DATA_URL}"

      - name: Sync map data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--verbose)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          mise exec -- ./scripts/sync-data.sh "${args[@]}"
